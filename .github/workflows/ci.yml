name: Portfolio validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate portfolio structure and links
        run: python tools/validate_portfolio.py

  demo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate fictional qualification data
        run: node demos/qualification-studio/tests/data.mjs
      - name: Test small-group demo behavior and isolation
        run: node --test demos/small-group-demo/tests/*.test.mjs
