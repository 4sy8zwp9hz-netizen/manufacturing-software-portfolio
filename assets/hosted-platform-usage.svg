    <line x1="100" y1="447" x2="770" y2="447" />
    <line x1="100" y1="409" x2="770" y2="409" />
    <line x1="100" y1="379" x2="100" y2="523" />
    <line x1="268" y1="379" x2="268" y2="523" />
    <line x1="435" y1="379" x2="435" y2="523" />
    <line x1="603" y1="379" x2="603" y2="523" />
    <line x1="770" y1="379" x2="770" y2="523" />
