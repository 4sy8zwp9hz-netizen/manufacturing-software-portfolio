<svg xmlns="http://www.w3.org/2000/svg" width="880" height="610" viewBox="0 0 880 610" role="img" aria-labelledby="usage-title usage-description">
  <title id="usage-title">Hosted application usage over time</title>
  <desc id="usage-description">Weekly aggregate snapshots from September 11 through November 6, 2026. Cumulative app opens and reloads reach 6,136. Client IP tracking starts October 16 and reaches 339 distinct recorded addresses by November 6. Neither measure counts unique people.</desc>
