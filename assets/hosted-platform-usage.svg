    <text x="33" y="126" fill="#20352c" font-size="22" font-weight="700">App opens and reloads</text>
    <text x="33" y="350" fill="#20352c" font-size="22" font-weight="700">Distinct client IPs</text>
    <rect x="100" y="379" width="419" height="144" fill="#edf1ed" />
    <g stroke="#d5dfd7" stroke-width="1">
