<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1600" height="900" fill="#fbfcf8" rx="0"/><text x="800" y="48" text-anchor="middle" font-size="17" fill="#147b68" font-weight="700">QUALITY ENGINEERING  /  FICTIONAL EXAMPLE</text><text x="800" y="104" text-anchor="middle" font-size="42" fill="#283831" font-weight="700">Make the comparison reviewable</text><text x="800" y="142" text-anchor="middle" font-size="23" fill="#63766d" font-weight="400">Link the records. Show what is complete. Compare wafers sharing a run.</text><line x1="64" y1="188" x2="524" y2="188" stroke="#147b68" stroke-width="3"/><text x="64" y="223" font-size="18" fill="#147b68" font-weight="700">01</text><text x="106" y="223" font-size="24" fill="#283831" font-weight="700">Define the population</text><text x="64" y="258" font-size="18" fill="#63766d" font-weight="400">Physical identity and compatible tests</text><line x1="564" y1="188" x2="1024" y2="188" stroke="#147b68" stroke-width="3"/><text x="564" y="223" font-size="18" fill="#147b68" font-weight="700">02</text><text x="606" y="223" font-size="24" fill="#283831" font-weight="700">Choose the endpoint</text><text x="564" y="258" font-size="18" fill="#63766d" font-weight="400">Wafer outcome or evaluable device yield</text><line x1="1064" y1="188" x2="1524" y2="188" stroke="#147b68" stroke-width="3"/><text x="1064" y="223" font-size="18" fill="#147b68" font-weight="700">03</text><text x="1106" y="223" font-size="24" fill="#283831" font-weight="700">Inspect the evidence</text><text x="1064" y="258" font-size="18" fill="#63766d" font-weight="400">Observed counts before model output</text><rect x="64" y="300" width="716" height="440" fill="white" rx="8"/><rect x="812" y="300" width="724" height="440" fill="white" rx="8"/><text x="90" y="343" font-size="25" fill="#283831" font-weight="700">How much of each cohort is complete?</text><text x="90" y="376" font-size="18" fill="#63766d" font-weight="400">Each invented cohort contains 100 wafers.</text><rect x="92" y="402" width="14" height="14" fill="#147b68" rx="0"/><text x="116" y="415" font-size="16" fill="#63766d" font-weight="400">Completed</text><rect x="262" y="402" width="14" height="14" fill="#e5ede6" rx="0"/><text x="286" y="415" font-size="16" fill="#63766d" font-weight="400">Pending</text><text x="90" y="488" font-size="18" fill="#283831" font-weight="600">Earlier cohort</text><rect x="266" y="468" width="450" height="28" fill="#e5ede6" rx="3"/><rect x="266" y="468" width="432" height="28" fill="#147b68" rx="3"/><text x="266" y="521" font-size="17" fill="#63766d" font-weight="400">96 completed / 4 pending</text><text x="90" y="570" font-size="18" fill="#283831" font-weight="600">Middle cohort</text><rect x="266" y="550" width="450" height="28" fill="#e5ede6" rx="3"/><rect x="266" y="550" width="315" height="28" fill="#147b68" rx="3"/><text x="266" y="603" font-size="17" fill="#63766d" font-weight="400">70 completed / 30 pending</text><text x="90" y="652" font-size="18" fill="#283831" font-weight="600">Recent cohort</text><rect x="266" y="632" width="450" height="28" fill="#e5ede6" rx="3"/><rect x="266" y="632" width="135" height="28" fill="#147b68" rx="3"/><text x="266" y="685" font-size="17" fill="#63766d" font-weight="400">30 completed / 70 pending</text><text x="840" y="343" font-size="25" fill="#283831" font-weight="700">Compare positions within shared runs</text><text x="840" y="376" font-size="18" fill="#63766d" font-weight="400">Illustrative aggregate; each bar shows passed / tested.</text><line x1="894" y1="653" x2="1492" y2="653" stroke="#e5ede6" stroke-width="2"/><text x="842" y="659" font-size="17" fill="#63766d" font-weight="400">0%</text><line x1="894" y1="581.6666666666666" x2="1492" y2="581.6666666666666" stroke="#e5ede6" stroke-width="2"/><text x="842" y="587.6666666666666" font-size="17" fill="#63766d" font-weight="400">20%</text><line x1="894" y1="510.33333333333337" x2="1492" y2="510.33333333333337" stroke="#e5ede6" stroke-width="2"/><text x="842" y="516.3333333333334" font-size="17" fill="#63766d" font-weight="400">40%</text><line x1="894" y1="439" x2="1492" y2="439" stroke="#e5ede6" stroke-width="2"/><text x="842" y="445" font-size="17" fill="#63766d" font-weight="400">60%</text><rect x="928" y="546" width="64" height="107" fill="#147b68" rx="3"/><text x="960" y="534" text-anchor="middle" font-size="19" fill="#283831" font-weight="600">30.0%</text><text x="960" y="682" text-anchor="middle" font-size="18" fill="#283831" font-weight="600">First</text><text x="960" y="708" text-anchor="middle" font-size="17" fill="#63766d" font-weight="400">24 / 80</text><rect x="1073" y="523.7083333333334" width="64" height="129.29166666666666" fill="#147b68" rx="3"/><text x="1105" y="511.70833333333337" text-anchor="middle" font-size="19" fill="#283831" font-weight="600">36.3%</text><text x="1105" y="682" text-anchor="middle" font-size="18" fill="#283831" font-weight="600">Second</text><text x="1105" y="708" text-anchor="middle" font-size="17" fill="#63766d" font-weight="400">29 / 80</text><rect x="1218" y="514.7916666666666" width="64" height="138.20833333333334" fill="#147b68" rx="3"/><text x="1250" y="502.79166666666663" text-anchor="middle" font-size="19" fill="#283831" font-weight="600">38.8%</text><text x="1250" y="682" text-anchor="middle" font-size="18" fill="#283831" font-weight="600">Third</text><text x="1250" y="708" text-anchor="middle" font-size="17" fill="#63766d" font-weight="400">31 / 80</text><rect x="1363" y="492.5" width="64" height="160.5" fill="#147b68" rx="3"/><text x="1395" y="480.5" text-anchor="middle" font-size="19" fill="#283831" font-weight="600">45.0%</text><text x="1395" y="682" text-anchor="middle" font-size="18" fill="#283831" font-weight="600">Last</text><text x="1395" y="708" text-anchor="middle" font-size="17" fill="#63766d" font-weight="400">36 / 80</text><rect x="64" y="765" width="1472" height="63" fill="#edf3ec" rx="5"/><text x="87" y="793" font-size="18" fill="#147b68" font-weight="700">Interpretation</text><text x="87" y="817" font-size="20" fill="#283831" font-weight="400">Recent completion and shared-run context can change how engineers interpret an apparent trend.</text><line x1="64" y1="849" x2="1536" y2="849" stroke="#e5ede6" stroke-width="2"/><text x="64" y="879" font-size="17" fill="#63766d" font-weight="400">Illustration only · invented values · no model fit, production result, or private application screenshot</text><text x="1370" y="879" font-size="17" fill="#63766d" font-weight="400">Matthew Chung</text></g></svg>